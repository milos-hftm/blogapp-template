<mat-toolbar class="app-header">
  <span class="brand">
    <mat-icon aria-hidden="true">article</mat-icon>
    <span>{{ title }}</span>
  </span>

  <span class="spacer"></span>

  <nav>
    <a
      mat-button
      routerLink="/"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Blog
    </a>

    @if (authEnabled && (!authStore.isAuthenticated() || canCreateBlog())) {
      <a mat-button routerLink="/add-blog" routerLinkActive="active-link">
        <mat-icon aria-hidden="true">add</mat-icon>
        Neuer Beitrag
      </a>
    }

    <a mat-button routerLink="/about" routerLinkActive="active-link">About</a>
  </nav>

  @if (authEnabled) {
    @if (authStore.isAuthenticated()) {
      <span class="user-name">{{ displayName() }}</span>
      <button mat-button type="button" (click)="logout()">
        <mat-icon aria-hidden="true">logout</mat-icon>
        Logout
      </button>
    } @else {
      <a mat-button routerLink="/login" routerLinkActive="active-link">
        <mat-icon aria-hidden="true">login</mat-icon>
        Login
      </a>
    }
  }

  <button
    mat-icon-button
    type="button"
    class="theme-toggle"
    (click)="toggleTheme()"
    [attr.aria-label]="isDarkTheme() ? 'Light Mode aktivieren' : 'Dark Mode aktivieren'"
  >
    <mat-icon>{{ isDarkTheme() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
